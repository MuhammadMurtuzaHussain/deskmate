name: Release

# A tag (v1.0.0, v1.0.0-rc.1) builds macOS (universal), Windows and Linux, uploads everything to a DRAFT release with
# notes from CHANGELOG.md, and stops there: publishing the draft is a person's job (docs/RELEASING.md).
# Run it by hand (Actions → Release → Run workflow) to build without releasing; the files land as workflow artifacts.
#
# Signing switches on by itself when these repository secrets exist, and is skipped when they don't:
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD        Developer ID Application certificate (.p12, base64) and its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID         notarization with an Apple ID, or
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER         notarization with an App Store Connect API key
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD        a Windows code-signing certificate (optional)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (universal), os: macos-latest, target: --mac }
          - { name: Windows, os: windows-latest, target: --win }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME but package.json says $want"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The app-control helper, arm64 + x86_64 in one binary, for the universal app.
      - if: runner.os == 'macOS'
        run: node scripts/build-hands.cjs --universal
      - name: App Store Connect key file
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi
      - name: Package${{ startsWith(github.ref, 'refs/tags/v') && ' and upload to the draft release' || '' }}
        shell: bash
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish "$PUBLISH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when the secret is not set: scripts/signing.cjs drops empty values, and the Mac build is ad-hoc signed.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Smoke-test the package
        if: runner.os == 'macOS'
        run: node scripts/smoke-package.cjs
      - name: Keep the files (manual runs)
        if: env.PUBLISH == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: deskmate-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: ignore
          retention-days: 7

  notes:
    name: Release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.cjs "$version" > notes.md
          pre=""
          case "$version" in *-*) pre="--prerelease" ;; esac
          gh release edit "$GITHUB_REF_NAME" --draft --title "Deskmate $version" --notes-file notes.md $pre
