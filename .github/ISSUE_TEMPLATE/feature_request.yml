name: Idea or feature
description: Something she should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like her to do
      description: In the words you'd say to her, if it's something to ask for.
      placeholder: '"Clean up my Downloads and tell me what you moved"'
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would save you, or what you do today instead.
  - type: textarea
    id: safety
    attributes:
      label: Anything she should ask before doing
      description: Sends, deletes, buys, posts? Say where a read-back belongs.
